eyebrow: Recruit
title: |-
  人に寄り添う仕事を、
  誠実に続けていくために。
lead: 坂戸市で福祉用具と居宅介護支援に取り組む、シノテクス株式会社です。良い数字は、素直に喜ぶ。ただし、数字のために無理は重ねない。一人ひとりの利用者さまに丁寧に向き合える働き方を、仕組みから整えています。
points_title: シノテクスの働き方
points:
  - title: 数字も、向き合い方も
    text: 売上・利益の数字は、テストの点数のようなもの。良い数字が取れれば、素直にうれしいと考えています。ただし、数字のために無理を重ねることはしません。目の前の利用者さまに丁寧に向き合うことを大切にしています。
  - title: 土日祝休み・年間休日125日
    text: 暮らしも大切にできるよう、休みをしっかり確保しています。
  - title: 事務はシステム・AIで簡素化
    text: 記録や書類などの事務作業は、システムや自動化で手間を減らし、本来の仕事に時間を使えるようにしています。
  - title: 地域に根ざして2事業
    text: 2014年創業。福祉用具事業と居宅介護支援事業が同じ地域で連携し、利用者さまの暮らしを支えます。
roles_title: 募集職種
roles:
  - name: 福祉用具の提案・相談スタッフ
    desc: ケアマネジャーや関係機関と連携し、利用者さまの身体の状態や住まいに合った福祉用具を提案・調整します。
    status: 募集中
  - name: 介護支援専門員（ケアマネジャー）
    desc: 利用者さまとご家族の思いを聞き取り、暮らしに合ったケアプランを作成。事業所や医療機関との調整も担います。
    status: 募集中
  - name: 事務員
    desc: 受付・書類作成など、事業所の運営を支えます。
    status: 現在は募集していません
